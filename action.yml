name: "New Code Coverage Gate"
description: "Fail a PR when new or overall line coverage (LCOV / Cobertura / JaCoCo) drops below your thresholds, with a PR comment"
author: "MisterPandaPooh"
branding:
  icon: "shield"
  color: "green"

inputs:
  coverage-file:
    description: "Path to the LCOV, Cobertura XML or JaCoCo XML coverage file (relative to the workspace)"
    required: true
  min-coverage:
    description: "Minimum overall project coverage % required (optional - if not provided, overall coverage check is disabled)"
    required: false
  min-coverage-new-code:
    description: "Minimum new code coverage % required (optional - if not provided, diff coverage check is disabled)"
    required: false
  base-branch:
    description: "Branch to compare against, with or without the origin/ prefix (e.g. main or origin/main)"
    required: false
    default: "origin/main"
  github-token:
    description: "GitHub token for commenting on PR"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install diff-cover
      shell: bash
      run: python -m pip install --quiet "diff-cover>=9"

    - name: Configure Git
      shell: bash
      run: git config --global --add safe.directory '*'

    # Runs from the caller's workspace: coverage-file and git commands apply to the caller's repo
    - name: Run coverage checks
      shell: bash
      run: node "${{ github.action_path }}/dist/index.cjs"
      env:
        INPUT_COVERAGE-FILE: ${{ inputs.coverage-file }}
        INPUT_MIN-COVERAGE: ${{ inputs.min-coverage }}
        INPUT_MIN-COVERAGE-NEW-CODE: ${{ inputs.min-coverage-new-code }}
        INPUT_BASE-BRANCH: ${{ inputs.base-branch }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
