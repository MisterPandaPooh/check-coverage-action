name: Release

# On a published release vX.Y.Z, move the major tag (vX) so `uses: ...@vX` follows it
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    name: Move major version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the major tag to this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not vX.Y.Z, nothing to do"
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
          echo "✅ $MAJOR now points to $TAG"
